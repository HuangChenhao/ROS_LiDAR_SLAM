ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.3
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.05
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true
    reset_on_time_jump: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Use only measured forward velocity and Ackermann-derived yaw rate.
    # The vendor absolute pose is intentionally ignored.
    odom0: /odom_raw
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 20
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
    odom0_twist_rejection_threshold: 3.0

    # Fuse gyro yaw rate, but not magnetometer-free absolute yaw. This avoids
    # feeding Madgwick drift back into the odom frame as an absolute heading.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_twist_rejection_threshold: 2.0
    imu0_remove_gravitational_acceleration: false

    use_control: false
