### ROSMaster R2 planar odometry fusion
#
# Historical bags showed impossible /odom pose jumps of 10-21 m in 0.1 s.
# Fuse wheel/driver velocities instead of its absolute pose so the EKF cannot
# copy a pose reset into odom. IMU yaw and yaw rate stabilize Ackermann turns.
ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true
    reset_on_time_jump: true

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom_raw
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 20
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false
    odom0_twist_rejection_threshold: 5.0

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: true
    imu0_pose_rejection_threshold: 5.0
    imu0_twist_rejection_threshold: 5.0
    imu0_remove_gravitational_acceleration: true

    use_control: false
