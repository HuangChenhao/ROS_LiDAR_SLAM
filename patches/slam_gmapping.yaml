/slam_gmapping:
  ros__parameters:
    use_sim_time: false
    base_frame: base_footprint
    odom_frame: odom
    map_frame: map

    # RPLidar A1: reject near-body returns and noisy long-range outdoor hits.
    maxRange: 8.0
    maxUrange: 6.0
    lskip: 0

    # Accept enough scans at both 0.17 m/s and 0.33 m/s.
    linearUpdate: 0.08
    angularUpdate: 0.08
    temporalUpdate: 0.50
    map_update_interval: 1.0
    transform_publish_period: 0.05

    delta: 0.05
    xmin: -20.0
    ymin: -20.0
    xmax: 20.0
    ymax: 20.0
    occ_thresh: 0.25

    particles: 80
    resampleThreshold: 0.5
    minimumScore: 55.0
    iterations: 8
    kernelSize: 1
    sigma: 0.05
    lsigma: 0.075
    ogain: 3.0
    lstep: 0.05
    astep: 0.05
    llsamplerange: 0.05
    llsamplestep: 0.01
    lasamplerange: 0.02
    lasamplestep: 0.005

    # EKF odometry is now valid; retain moderate Ackermann/slip uncertainty.
    srr: 0.06
    srt: 0.12
    str: 0.06
    stt: 0.12
